<!DOCTYPE html>
<html lang="pt-BR">

 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitLife</title>
    <link rel="stylesheet" href="style.css">
 </head>

 <body>

   <header>
    <h1>FitLife</h1>
    <h2>Gerenciamento de alunos</h2>
    <p>Cadastre, consulte e gerencie os alunos da academia.</p>
   </header>

   <main class="container">
    <section class="card card-formulario">
     <h2>Novo aluno</h2>

     <div class="campo">
       <label for="nome">Nome</label>
       <input type="text" id="nome">
     </div>

      <div class="campo">
       <label for="idade">Idade</label>
       <input type="number" id="idade">
      </div>

      <div class="campo">
        <label for="plano">Plano</label>

       <select id="plano">
         <option value="">Selecione um plano</option>
         <option value="Mensal">Mensal</option>
         <option value="Trimestral">Trimestral</option>
         <option value="Anual">Anual</option>
       </select>
     </div>

     <div class="campo">
       <label for="status">Status</label>

       <select id="status">
         <option value=""> Selecione um status </option>
         <option value="Ativo"> Ativo </option>
         <option value="Inativo"> Inativo </option>
        </select>
     </div>

     <button class="botao-cadastrar" onclick="cadastrarAluno()">Cadastrar Aluno</button>
    
    </section>

    <section class="card card-lista"> 
     <h2>Alunos cadastrados</h2>
    
     <div class="campo">
       <label for="buscar">Aluno</label>
       <input type="text" id="buscar">
     </div>

     <div class="acoes-busca">
       <button onclick="buscarAluno()">Buscar</button>
       <button onclick="mostrarTodos()">Mostrar Todos</button>
     </div> 

     <div id="resultado"></div>

    </section>
   </main>

  <script src="script.js"></script>

 </body>

</html>
